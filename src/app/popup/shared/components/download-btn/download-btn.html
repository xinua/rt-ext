@let isVideo = type() === types.VIDEO;
@let hasError = states()[type()] === 'failed' && errors()[type()];
@let percent = progress()[type()];

<button
  matMiniFab
  extended
  class="pl-0! pr-1! text-right relative label-indicator"
  [class]="isVideo ? 'rounded-e-none! pr-0! pl-1!' : 'rounded-s-none! pl-0! pr-1!'"
  [class.cursor-incognito]="isIncognito()"
  [attr.aria-label]="ariaLabels()[type()]"
  [matTooltip]="hasError ? errors()[type()] : tooltips()[type()]"
  [matTooltipDisabled]="!tooltips()[type()]"
  matTooltipPosition="above"
  disabledInteractive
  (click)="download.emit()"
  [disabled]="isDisabled()"
>
  <div class="absolute right-0.5 top-1">
    <div class="relative flex size-3">
      @if (states()[type()] === 'processing') {
        <span
          class="absolute w-2 h-2 rounded-full {{ indicators()[type()] }} opacity-75 animate-ping"
        ></span>
      }
      <span class="w-2 h-2 rounded-full {{ indicators()[type()] }}" aria-hidden="true"></span>
    </div>
  </div>

  @if (states()[type()] === 'processing' && percent !== null) {
    @if (percent < 100) {
      <span class="text-[10px] tabular-nums" aria-hidden="true">{{ percent }}%</span>
    } @else {
      <mat-icon svgIcon="loading" class="scale-75" matTooltip="Post-processing..." />
    }
  } @else {
    <mat-icon [svgIcon]="icons()[type()]" class="scale-75" />
  }
</button>
