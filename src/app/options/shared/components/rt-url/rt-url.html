@let isConnected = isConnected$ | async;
<section class="flex flex-col gap-8 items-center">
  <div class="relative w-full text-center">
    <h2 class="text-2xl font-bold font-zinco select-none transition-opacity duration-500" [class.opacity-0!]="isConnected">{{ message() }}</h2>
    <h2 class="text-2xl font-bold font-zinco select-none opacity-0 transition-opacity duration-500 absolute top-0 left-1/2 -translate-x-1/2" [class.opacity-100!]="isConnected">Connected!</h2>
  </div>

  <mat-form-field 
    appearance="outline" 
    class="w-1/2 mx-auto opacity-0 transition-opacity duration-1000" 
    [class.opacity-100]="isVisibleInput()"
  >
    <mat-label>Enter URL here</mat-label>
    <input 
      matInput 
      autofocus 
      type="url" 
      placeholder="http(s)://retriever-app.url" 
      rtConnectValidator
      [formControl]="url" 
    />
    <mat-icon matPrefix svgIcon="retriever" />

    @if (url.pending) {
      <mat-icon matSuffix fontIcon="loop" class="animate-spin-left" />
    } @else if (isConnected) {
      <mat-icon matSuffix fontIcon="check" />
    }
  </mat-form-field>
</section>
